# Self-Hosting-Paket (/WK90/, /T130/) — identische Codebasis als On-Premises-Deployment.
# Start:  docker compose up -d
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATA_DIR: /data
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - vct-data:/data
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        VITE_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:4000}
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  vct-data:
